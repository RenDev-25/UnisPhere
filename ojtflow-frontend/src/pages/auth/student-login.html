
  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Student Login | OJTFlow</title>

    <link rel="stylesheet" href="/styles/main.css" />
    <link rel="stylesheet" href="/styles/pages/auth.css" />
  </head>

  <body data-portal="student" data-page="student-login">

    <main id="page-content" class="auth-page">

      <section class="auth-card">

        <header class="auth-card__brand">
          <span class="auth-card__logo" data-js-brand>OJTFlow</span>
          <span class="chip" data-js-version>v2.4</span>
        </header>

        <h1 class="t-headline-md" data-js-heading> Welcome Back </h1>

        <p class="t-body-md auth-card__subtitle" data-js-subtitle>
          Sign in to your OJTFlow Student Portal.
        </p>
        <!-- Role Toggle -->
        <nav
          class="segmented"
          role="tablist"
          aria-label="Select your portal"
        >
          <a
            class="segmented__option segmented__option--active"
            href="/pages/auth/student-login.html"
            role="tab"
            aria-selected="true"
          >
            <i class="icon icon--mortarboard" aria-hidden="true"></i>
            <span>Student</span>
          </a>

          <a
            class="segmented__option"
            href="/pages/auth/coordinator-login.html"
            role="tab"
            aria-selected="false"
          >
            <span>OJT Coordinator</span>
          </a>
        </nav>


<form id="login-form" novalidate>

  <!-- Institutional Email Address -->
  <div class="field" data-js-field="email">

    <label class="field__label" for="email" data-js-email-label>
      Institutional Email Address
    </label>

    <input
      class="input"
      id="email"
      name="email"
      type="email"
      placeholder="e.g. s.delacruz@university.edu.ph"
      autocomplete="username"
      data-js-email-input
    />

    <span class="field__error" data-js-error></span>

  </div>

  <!-- Password -->
  <div class="field" data-js-field="password">

    <label class="field__label" for="password" data-js-password-label>
      Password
    </label>

    <input
      class="input"
      id="password"
      name="password"
      type="password"
      placeholder="Enter your password"
      autocomplete="current-password"
      data-js-password-input
    />

    <button
      type="button"
      class="btn btn--ghost"
      data-js-toggle-password
      aria-label="Show password"
      aria-pressed="false"
    >
      Show
    </button>

    <span class="field__error" data-js-error></span>

  </div>

  <!-- Remember Me and Forgot Password -->
  <div class="auth-card__row">

    <label>
      <input type="checkbox" name="remember" />
      <span data-js-remember-label>Remember Me</span>
    </label>

    <a href="#" aria-disabled="true" data-js-forgot-password>
      Forgot Password?
    </a>

  </div>


<button
  class="btn btn--primary auth-card__submit"
  type="submit"
>
  <span data-js-login-label>Login as Student</span>
  <span aria-hidden="true" class="auth-card__submit-arrow">→</span>
</button>


</form>

        
        <p class="t-body-md auth-card__footer">
              <span data-js-create-account-prompt>
                Don't have an account?
              </span>

              <a
                href="#"
                aria-disabled="true"
                data-js-create-account
              >
                Create Account
              </a>
        </p>


      </section>


        <p class="auth-page__status">
            <span class="dot dot--green" aria-hidden="true"></span>

            <span data-js-status-message>
              OJT Management &amp; Verification Subsystem Active
            </span>

            &bull;

            <span data-js-academic-year>
              Academic Year 2024-2025
            </span>
        </p>

    </main>

    <script
      type="module"
      src="/ts/pages/auth/student-login.ts"
    ></script>

  </body>
  </html>
