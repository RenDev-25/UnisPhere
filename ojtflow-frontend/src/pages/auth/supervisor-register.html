<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Supervisor Registration | UNISphere</title><link rel="stylesheet" href="/styles/main.css"><link rel="stylesheet" href="/styles/pages/supervisor.css"></head><body data-portal="supervisor"><main class="sup-auth"><section class="card sup-auth-card"><div class="sup-brand">UNISphere <span>SUPERVISOR PORTAL</span></div><h1>Create Supervisor Account</h1><p>Register using your email address and password. No Coordinator approval is required.</p><form id="sup-register-form"><label>Full name<input name="name" type="text" autocomplete="name" required></label><label>Email address<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" minlength="8" autocomplete="new-password" required><small>At least 8 characters.</small></label><label>Confirm password<input name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></label><button class="button button--primary" type="submit">Create Account</button><p id="sup-auth-message" role="alert"></p></form><p>Already registered? <a href="/pages/auth/supervisor-login.html">Log in</a></p></section></main><script type="module" src="/ts/pages/auth/supervisor-register.ts"></script></body></html>
