
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Coordinator Dashboard | UNISphere</title>

  <link rel="stylesheet" href="/styles/main.css" />
  <link
    rel="stylesheet"
    href="/styles/pages/coordinator-dashboard.css"
  />
</head>

<body
  data-portal="coordinator"
  data-page="coordinator-dashboard"
>
  <div class="app-shell">

    <!-- SIDEBAR -->
    <aside
      class="sidebar"
      id="sidebar"
      data-js-sidebar
    ></aside>

    <!-- TOPBAR -->
    <header
      class="topbar"
      id="topbar"
      data-js-topbar
    ></header>

    <!-- MAIN CONTENT -->
    <main class="app-main">
      <div class="app-content">

        <section class="page coordinator-dashboard">

          <!-- DASHBOARD HEADING -->
          <header
            id="page-heading"
            class="coordinator-dashboard__heading"
          ></header>

          <!-- KPI CARDS -->
          <section
            id="dashboard-kpis"
            class="coordinator-dashboard__kpis coordinator-dashboard__kpi-grid"
            aria-label="Dashboard summary"
          ></section>

          <!-- ANALYTICS -->
          <section class="coordinator-dashboard__analytics">

            <!-- STATUS DISTRIBUTION -->
            <article class="card dashboard-chart-card">

              <header class="dashboard-chart-card__header">
                <div>
                  <h2 class="dashboard-chart-card__title">
                    Student OJT Status Distribution
                  </h2>

                  <p class="dashboard-chart-card__subtitle">
                    Overview of student deployment progress.
                  </p>
                </div>
              </header>

              <div class="dashboard-donut">

                <div class="dashboard-donut__visual">
                  <div class="dashboard-donut__canvas">

                    <canvas
                      id="status-donut"
                      aria-label="Student OJT status distribution chart"
                    ></canvas>

                    <div
                      id="donut-center"
                      class="dashboard-donut__center"
                    >
                      <strong>248</strong>
                      <span>CICS Cohort</span>
                    </div>

                  </div>
                </div>

                <ul
                  id="status-legend"
                  class="dashboard-donut__legend"
                ></ul>

              </div>
            </article>

            <!-- MONTHLY ANALYTICS -->
            <article class="card dashboard-chart-card">

              <header class="dashboard-chart-card__header">
                <div>
                  <h2 class="dashboard-chart-card__title">
                    Applications and Placement Analytics
                  </h2>

                  <p class="dashboard-chart-card__subtitle">
                    Monthly overview of applications and placements.
                  </p>
                </div>
              </header>

              <div class="dashboard-bar-chart">
                <canvas
                  id="monthly-analytics-chart"
                  aria-label="Monthly applications and placement analytics chart"
                ></canvas>
              </div>

            </article>

          </section>

        </section>

      </div>
    </main>

  </div>

  <!-- DASHBOARD SCRIPT -->
  <script
    type="module"
    src="/ts/pages/coordinator/dashboard.ts"
  ></script>

</body>
</html>
