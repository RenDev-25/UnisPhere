
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>OJT Requirements | UNISPHERE</title>

  <link rel="stylesheet" href="/styles/main.css" />
  <link rel="stylesheet" href="/styles/pages/student-ojt-requirements.css" />

</head>

<body data-portal="student" data-page="student-requirements">

  <div class="app-shell" id="app-shell">

    <aside
      class="sidebar"
      id="sidebar"
      data-js-sidebar
    ></aside>

    <div class="app-main">

      <header
        class="topbar"
        id="topbar"
        data-js-topbar
      ></header>

      <main class="page-content" id="page-content">

        <div class="page ojt-requirements-page">

          <!-- 6.4.2 PAGE HEADING -->
          <section
            class="ojt-requirements-header"
            id="requirements-list-view"
          >
            <!-- Rendered by ojt-requirements.ts -->
          </section>

          <!-- 6.4.3 COMPLETION CARD -->
          <section
            class="requirements-completion-section"
            aria-label="Requirements completion"
          >
            <!-- Rendered by ojt-requirements.ts -->
          </section>

          <!-- 6.4.4 REQUIREMENT LIST -->
          <section
            class="requirements-list-section"
            aria-label="Required verification documents"
          >
            <!-- Rendered by ojt-requirements.ts -->
          </section>

          <!-- 6.4.5 ASSISTANCE CARD -->
      
          <!-- 6.4.6 REQUIREMENT DETAIL VIEW -->
          <section
            class="requirement-detail-section"
            id="requirement-detail-view"
            aria-label="Requirement details"
            hidden
          >
            <!-- Rendered by ojt-requirements.ts -->
          </section>

        </div>

      </main>

    </div>

  </div>

  <script
    type="module"
    src="/ts/pages/student/ojt-requirements.ts"
  ></script>

</body>
</html>
