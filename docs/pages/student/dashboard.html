<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Student Dashboard | OJTFlow</title>

  <script type="module" crossorigin src="/UnisPhere/assets/dashboard-CrpKuu07.js"></script>
  <link rel="modulepreload" crossorigin href="/UnisPhere/assets/session-C6yT7gL8.js">
  <link rel="modulepreload" crossorigin href="/UnisPhere/assets/dom-DcOuyLef.js">
  <link rel="modulepreload" crossorigin href="/UnisPhere/assets/route-guard-MQy5MPzz.js">
  <link rel="modulepreload" crossorigin href="/UnisPhere/assets/app-shell-PbQyGsAe.js">
  <link rel="stylesheet" crossorigin href="/UnisPhere/assets/dom-BtlCM8jg.css">
  <link rel="stylesheet" crossorigin href="/UnisPhere/assets/dashboard-CppUcs6i.css">
</head>

<body data-portal="student" data-page="student-dashboard">

  <div class="app-shell" id="app-shell">

    <aside
      class="sidebar"
      id="sidebar"
      data-js-sidebar
    ></aside>

    <div class="app-main">

      <header
        class="topbar"
        id="topbar"
        data-js-topbar
      ></header>

      <main class="page-content app-content" id="page-content">

        <!-- =====================================
             6.1.2 WELCOME CARD
        ====================================== -->
        <section class="dashboard-panel dashboard-welcome">

          <div class="dashboard-welcome__header">

            <div class="dashboard-welcome__text" id="welcome">
              <!-- Rendered by dashboard.ts -->
            </div>

            <div
              class="welcome__pills"
              id="welcome-pills"
              aria-label="Student status"
            >
              <!-- Rendered by dashboard.ts -->
            </div>

          </div>

          <div
            class="dashboard-info-grid"
            id="student-info"
            aria-label="Student information"
          >
            <!-- Five student information tiles -->
          </div>

        </section>


        <!-- =====================================
             6.1.3 FOUR KPI CARDS
        ====================================== -->
        <section
          class="dashboard-kpis"
          id="kpis"
          aria-label="Student overview"
        >
          <!-- Rendered by dashboard.ts -->
        </section>


        <!-- =====================================
             6.1.4 APPLICATION STATUS ANALYTICS
        ====================================== -->
        <section class="chart-card dashboard-analytics">

          <div class="chart-card__header">

            <div>
              <h2 class="chart-card__title">
                Application Status Analytics
              </h2>

              <p class="chart-card__subtitle">
                Overview of your submitted company applications.
              </p>
            </div>

            <span class="chip" id="application-total-chip">
              Total: 0
            </span>

          </div>

          <div class="dashboard-analytics__content">

            <!--
              Chart.js doughnut chart will be connected in Stage 7.1.
              This placeholder reserves the chart dimensions.
            -->
            <div class="chart-card__canvas">

              <div class="dashboard-chart-placeholder">

                <div class="dashboard-donut">
                  <div class="dashboard-donut__center">

                    <strong id="chart-total">0</strong>

                    <span>APPLICATIONS</span>

                  </div>
                </div>

              </div>

            </div>

            <div
              class="dashboard-legend"
              id="application-legend"
              aria-label="Application status legend"
            >
              <!-- Rendered from sample application data -->
            </div>

          </div>

          <footer class="dashboard-card-footer">

            <span>Total Applications</span>

            <strong id="application-total-footer">0</strong>

          </footer>

        </section>


        <!-- =====================================
             6.1.5 OJT REQUIREMENTS COMPLETION
        ====================================== -->
        <section class="dashboard-panel dashboard-requirements">

          <div class="dashboard-section-heading">

            <div>
              <h2 class="dashboard-section-heading__title">
                OJT Requirements Completion
              </h2>

              <p class="dashboard-muted">
                Monitor the completion of your pre-deployment requirements.
              </p>
            </div>

            <strong
              class="dashboard-percentage"
              id="requirements-percentage"
            >
              0%
            </strong>

          </div>


          <!-- Full-width red progress bar -->
          <div
            class="dashboard-requirements__progress"
            id="requirements-progress"
          >
            <!-- Rendered by dashboard.ts -->
          </div>


          <!-- Four summary tiles -->
          <div
            class="dashboard-mini-grid"
            id="requirements-summary"
            aria-label="Requirements summary"
          >
            <!-- Rendered by dashboard.ts -->
          </div>


          <!-- Requirement status rows -->
          <div class="dashboard-requirements__details">

            <div class="dashboard-requirement-row">
              <span>Completed Requirements</span>
              <strong id="requirements-completed">0</strong>
            </div>

            <div class="dashboard-requirement-row">
              <span>Pending Verification</span>
              <strong id="requirements-pending">0</strong>
            </div>

            <div class="dashboard-requirement-row">
              <span>For Revision</span>
              <strong id="requirements-revision">0</strong>
            </div>

          </div>


          <div class="dashboard-requirements__action">

            <a
              href="/pages/student/ojt-requirements.html"
              class="btn btn--primary"
            >
              View Requirements
            </a>

          </div>

        </section>

      </main>

    </div>

  </div>


</body>
</html>
